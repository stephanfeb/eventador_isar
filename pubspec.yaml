name: eventador_isar
description: Isar storage for eventador — the event journal, snapshots and projection checkpoints in an Isar database.
version: 1.0.0
repository: https://github.com/twostack/eventador_isar
issue_tracker: https://github.com/twostack/eventador_isar/issues
topics:
  - event-sourcing
  - persistence
  - isar

environment:
  sdk: ^3.5.0

dependencies:
  eventador: ^5.0.0
  # Exact, not a caret: the generated schemas (*.g.dart) assert the Isar
  # version they were generated by, so a host resolving any other version
  # fails to compile with "Outdated generated code". Move this, the
  # generator below and the generated code together.
  isar_community: 3.3.2
  logging: ^1.2.0
  meta: ^1.16.0

dev_dependencies:
  isar_community_generator: 3.3.2
  build_runner: ^2.7.0
  dactor: ^1.3.0
  test: ^1.24.0
  lints: ^5.0.0

# eventador 5.0.0 is not on pub.dev yet; develop against the sibling
# checkout until it is. Remove before publishing.
dependency_overrides:
  eventador:
    path: ../eventador
  duraq:
    path: ../duraq/packages/duraq
